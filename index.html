<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ParseIt - Examen Interactivo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="vendor/choices.min.css">
    <link rel="stylesheet" href="src/styles.css">
</head>
<body>
    <header class="main-header">
        <div class="container">
            <div class="header-layout">
                <div class="header-brand">
                    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="logo-icon">
                        <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
                        <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
                    </svg>
                    <span class="brand-name">ParseIt</span>
                </div>
                
                <div class="header-controls-left">
                    <div class="percentage-selector">
                        <select id="percent-select" class="form-select">
                            <option value="0.05">5%</option>
                            <option value="1">100%</option>
                            <option value="0.75">75%</option>
                            <option value="0.50">50%</option>
                            <option value="0.25">25%</option>
                        </select>
                    </div>
                    <label class="switch-study" title="Corrección inmediata">
                        <input type="checkbox" id="check-estudio" checked>
                        <span class="slider-study"></span>
                        <span class="hide-mobile">Modo Estudio</span>
                    </label>
                    <button id="theme-toggle" class="btn-icon" aria-label="Cambiar tema">
                        <svg id="moon-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                        </svg>
                        <svg id="sun-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5"></circle>
                            <line x1="12" y1="1" x2="12" y2="3"></line>
                            <line x1="12" y1="21" x2="12" y2="23"></line>
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                            <line x1="1" y1="12" x2="3" y2="12"></line>
                            <line x1="21" y1="12" x2="23" y2="12"></line>
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                        </svg>
                    </button>
                </div>

                <div class="header-selector">
                    <select id="examen-select" class="form-select">
                        <option value="" disabled selected>Cargando exámenes...</option>
                    </select>
                </div>

                <div class="header-status-group">
                    <div id="timer-container" class="timer-container stat-badge hidden">
                        <span id="timer-display" class="timer-display">00:00</span>
                        <button id="btn-reiniciar" class="btn-reset" title="Reiniciar examen">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                                <path d="M3 3v5h5"></path>
                            </svg>
                        </button>
                    </div>
                    <button id="btn-finalizar" class="progress-bubble stat-badge" title="Finalizar Examen">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                            <polyline points="20 6 9 17 4 12"></polyline>
                        </svg>
                        <span id="progress-display">0 / 0</span>
                    </button>
                    <div id="examen-status" class="status-bubble hidden"></div>
                </div>
            </div>
        </div>
    </header>

    <main class="container">
        <div id="status-message" class="status-message hidden"></div>
        
        <!-- Sección de Guías de Estudio -->
        <section class="study-guides-section">
            <h2 class="section-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="section-icon">
                    <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"></path>
                    <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"></path>
                </svg>
                Guías de Estudio para Repaso
            </h2>
            <div class="guides-grid">
                <a href="/docu/repaso_01.html" class="guide-card" target="_blank" rel="noopener noreferrer">
                    <div class="guide-icon-wrapper cyan">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <line x1="9" y1="9" x2="15" y2="9"></line>
                            <line x1="9" y1="13" x2="15" y2="13"></line>
                            <line x1="9" y1="17" x2="15" y2="17"></line>
                        </svg>
                    </div>
                    <div class="guide-info">
                        <h3>Gestión de Sistemas</h3>
                        <p>Negocios y estrategia tecnológica</p>
                    </div>
                    <div class="guide-action">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                </a>
                <a href="/docu/repaso_02.html" class="guide-card" target="_blank" rel="noopener noreferrer">
                    <div class="guide-icon-wrapper purple">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
                            <polyline points="2 17 12 22 22 17"></polyline>
                            <polyline points="2 12 12 17 22 12"></polyline>
                        </svg>
                    </div>
                    <div class="guide-info">
                        <h3>Transformación Digital</h3>
                        <p>Conceptos avanzados e innovación</p>
                    </div>
                    <div class="guide-action">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                </a>
                <a href="/docu/repaso_03.html" class="guide-card" target="_blank" rel="noopener noreferrer">
                    <div class="guide-icon-wrapper amber">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path>
                        </svg>
                    </div>
                    <div class="guide-info">
                        <h3>Seguridad de la Información</h3>
                        <p>Protección y gestión de riesgos</p>
                    </div>
                    <div class="guide-action">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="7" y1="17" x2="17" y2="7"></line>
                            <polyline points="7 7 17 7 17 17"></polyline>
                        </svg>
                    </div>
                </a>
            </div>
        </section>
        
        <form id="examen-form" class="exam-form">
            <div id="preguntas-container">
                <!-- Se llenará dinámicamente -->
            </div>
        </form>
    </main>

    <footer class="main-footer">
        <div class="container">
            <div id="examen-metadatos" class="meta-container-footer">
                <!-- Se llenará dinámicamente -->
            </div>
            <div class="footer-bottom">
                <p>&copy; 2026 ParseIt - Sistema de Evaluación (v9)</p>
                <button id="btn-qr" class="btn-qr" aria-label="Mostrar QR de la página">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7"></rect>
                        <rect x="14" y="3" width="7" height="7"></rect>
                        <rect x="3" y="14" width="7" height="7"></rect>
                        <rect x="14" y="14" width="3" height="3"></rect>
                    </svg>
                    QR
                </button>
            </div>
        </div>
    </footer>

    <div id="qr-overlay" class="qr-overlay hidden" role="dialog" aria-modal="true" aria-label="QR Code">
        <div class="qr-modal">
            <img src="/public/qr.png" alt="QR Code para acceder a ParseIt" class="qr-image">
            <p class="qr-label">Escaneá para abrir ParseIt</p>
        </div>
    </div>

    <script>
        const qrOverlay = document.getElementById('qr-overlay');
        document.getElementById('btn-qr').addEventListener('click', () => {
            qrOverlay.classList.remove('hidden');
        });
        qrOverlay.addEventListener('click', (e) => {
            if (e.target === qrOverlay) qrOverlay.classList.add('hidden');
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') qrOverlay.classList.add('hidden');
        });
    </script>
    <script src="vendor/choices.min.js"></script>
    <script src="vendor/confetti.browser.min.js"></script>
    <script src="src/app.js" type="module"></script>
</body>
</html>
